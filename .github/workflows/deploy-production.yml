name: Deploy Production - swalook-landing-page

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-deploy-production
  cancel-in-progress: false

jobs:
  validate-before-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run build
        env:
          NODE_ENV: production
      - run: bun run test -- --coverage
        env:
          NODE_ENV: test
      - name: Security scan
        # Non-blocking until braces/fixed-upstream HIGH noise is cleared; still prints findings.
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm -v ${{ github.workspace }}:/workspace aquasec/trivy:0.60.0 \
            filesystem --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 /workspace
          docker run --rm -v ${{ github.workspace }}:/workspace aquasec/trivy:0.60.0 \
            filesystem --scanners secret --skip-dirs node_modules --skip-dirs .next --exit-code 1 /workspace
      - name: Dependency audit
        run: |
          set +e
          OUTPUT=$(bun audit 2>&1)
          set -e
          echo "$OUTPUT"
          # Ignore braces until a fixed version (>3.0.3) is published
          REAL_HIGH=$(echo "$OUTPUT" | grep -E -i "high:|critical:" | grep -vi "braces" | wc -l || echo "0")
          if [ "$REAL_HIGH" -gt 0 ] 2>/dev/null; then
            echo "FAIL: Found $REAL_HIGH HIGH/CRITICAL vulnerability(ies)"
            exit 1
          fi
          echo "OK: No HIGH/CRITICAL vulnerabilities (unfixed braces advisory ignored)"
        shell: bash

  deploy:
    needs: [validate-before-deploy]
    if: success()
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo "WARN: RENDER_DEPLOY_HOOK_URL secret is empty."
            echo "Relying on Render auto-deploy from the GitHub push to main."
            echo "To re-enable this step: Render → Service → Settings → Deploy Hook → GitHub secret RENDER_DEPLOY_HOOK_URL."
            exit 0
          fi
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL" || echo "000")
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "202" ]; then
            echo "FAIL: Render deploy hook returned $HTTP_CODE"
            exit 1
          fi
          echo "OK: Render deploy hook triggered (HTTP $HTTP_CODE)"

  post-deploy-smoke:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Render roll-out
        run: sleep 90
      - name: Smoke test production
        run: bash .github/scripts/smoke-test.sh "https://swalook-landing-page.onrender.com"
